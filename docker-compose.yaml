name: assistente-analitico-neo4j
services:
  neo4j:
    image: neo4j:5.26-community
    volumes:
      - sales-demo-data:/data
    ports:
      - "127.0.0.1:17474:7474"
      - "127.0.0.1:17687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_ADMIN_PASSWORD:?Defina NEO4J_ADMIN_PASSWORD no .env}"
      NEO4J_initial_dbms_default__database: sales-demo
      NEO4J_db_transaction_timeout: 5s
    mem_limit: 1g
volumes:
  sales-demo-data:
